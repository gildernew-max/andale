name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Pages build keeps /andale/ assets
        run: grep -q 'src="/andale/assets/' dist/index.html
      - name: Wrap build uses base /
        run: |
          npm run build:wrap
          grep -q 'src="/assets/' dist/index.html
          if grep -E '(src|href)="/andale/' dist/index.html; then
            echo "FAIL: wrap index.html still references /andale/ assets" >&2
            exit 1
          fi
